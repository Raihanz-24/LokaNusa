<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#047857">
    <title>Offline — LokaNusa</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 24px;
        }
        .card {
            max-width: 420px;
            text-align: center;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 40px 28px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, .06);
        }
        .badge {
            width: 64px; height: 64px; margin: 0 auto 16px;
            display: grid; place-items: center;
            border-radius: 20px;
            background: #047857;
        }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #64748b; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
        button {
            border: 0; cursor: pointer;
            background: #047857; color: #fff;
            font-size: 14px; font-weight: 600;
            padding: 12px 22px; border-radius: 999px;
        }
        button:hover { background: #036c50; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 1 0 0-18m0 18a9 9 0 1 1 0-18m0 18c.83 0 1.5-4.03 1.5-9s-.67-9-1.5-9m0 18c-.83 0-1.5-4.03-1.5-9s.67-9 1.5-9M3.6 9h16.8M3.6 15h16.8"/>
            </svg>
        </div>
        <h1>Anda sedang offline</h1>
        <p>Koneksi internet terputus. Periksa jaringan Anda lalu coba lagi untuk melanjutkan menjelajah LokaNusa.</p>
        <button type="button" onclick="window.location.reload()">Coba lagi</button>
    </div>
</body>
</html>
